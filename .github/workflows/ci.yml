name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: FedericoCarboni/setup-ffmpeg@v3
      # Hosted runners have no GPU, so the gpu tests skip and the CPU torch build is enough.
      - run: python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install ".[test]"
      # Not python -m pytest, which puts the checkout on sys.path and would test it instead of
      # the installed package, missing any file the wheel leaves out.
      - run: pytest -q -rs
